# Local Supabase for Takhti. Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Ports are in the 6432x block so this stack can run beside other Supabase projects on the same machine.
# The reasons for the settings that matter are in docs/plan/00-foundation/17-local-environment.md.

project_id = "takhti"

# The Data API (PostgREST and GraphQL) is switched off on purpose. Takhti's own API is the only way
# to data: every rule and permission lives in its services, and a second door straight into the
# tables would let a signed-in user step around them. Auth, Storage and Realtime are not affected.
[api]
enabled = false
port = 64321
schemas = []
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 64322
shadow_port = 64320
health_timeout = "3m"
major_version = 17

[db.pooler]
enabled = false
port = 64329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Migrations and seed data are applied by `pnpm db:migrate` and `pnpm db:seed` (packages/db), not by the CLI.
[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 64323
api_url = "http://127.0.0.1"

# Every email the app sends locally lands here: http://localhost:64324
[local_smtp]
enabled = true
port = 64324

[storage]
enabled = true
# The largest upload any purpose allows (a learning resource).
file_size_limit = "100MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Nobody signs themselves up: every user is invited by a school or created by Takhti staff.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 100
sms_sent = 100
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 60
token_verifications = 60
web3 = 30

[auth.email]
# Must stay true: switching it off disables signing in by email altogether, not only signing up.
# New sign-ups are already blocked by `auth.enable_signup = false` above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
# Must stay true for the same reason: it is the switch for phone sign-in as a whole.
enable_signup = true
enable_confirmations = true
template = "Your Takhti code is {{ .Code }}"
max_frequency = "5s"

# Phone sign-in needs a provider block or the local Auth server silently switches phones off.
# These values are placeholders: locally no SMS is ever sent. Seeded guardians' numbers are mapped
# to a fixed code in `[auth.sms.test_otp]`, which `pnpm db:seed` keeps in step with the seed accounts.
[auth.sms.twilio]
enabled = true
account_sid = "local-placeholder"
message_service_sid = "local-placeholder"
auth_token = "local-placeholder"

# Adds the active membership's claims to the token, so the same row-level-security policies protect
# Realtime and Storage. The function is created by a migration.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.mfa]
max_enrolled_factors = 10

# Two-factor sign-in for owner, finance and platform roles.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your Takhti code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 64327
backend = "postgres"
